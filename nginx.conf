events {}

http {
  upstream auth_service        { server auth-service:3001; }
  upstream fhir_service        { server fhir-service:3002; }
  upstream realtime_gateway    { server realtime-gateway:3003; }
  upstream ai_diagnosis        { server ai-diagnosis-service:3004; }
  upstream clinique_service    { server clinique-service:3005; }

  server {
    listen 5030 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location /api/auth/       { proxy_pass http://auth_service/; }
    location /api/fhir/       { proxy_pass http://fhir_service/; }
    location /api/diagnosis/  { proxy_pass http://ai_diagnosis/; }
    location /api/clinique/   { proxy_pass http://clinique_service/; }

    # Passerelle WebSocket (notifications temps réel)
    location /ws/ {
      proxy_pass http://realtime_gateway/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
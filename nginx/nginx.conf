events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream auth_service          { server auth-service:3001; }
    upstream fhir_service          { server fhir-service:3002; }
    upstream labo_service          { server labo-service:3003; }
    upstream pharmacie_service     { server pharmacie-service:3004; }
    upstream facturation_service   { server facturation-service:3005; }
    upstream statistiques_service  { server statistiques-service:3006; }
    upstream ai_diagnosis          { server host.docker.internal:3007; }
    upstream notification_service  { server notification-service:3008; }
    upstream audit_service         { server audit-service:3009; }
    upstream file_service          { server file-service:3010; }
    upstream realtime_gateway      { server realtime-gateway:3011; }
    upstream clinique_service      { server clinique-service:3016; }

    server {
        listen 5030;
        server_name localhost;

        location /api/auth/          { proxy_pass http://auth_service/; }
        location /api/fhir/          { proxy_pass http://fhir_service/; }
        location /api/labo/          { proxy_pass http://labo_service/; }
        location /api/pharmacie/     { proxy_pass http://pharmacie_service/; }
        location /api/facturation/   { proxy_pass http://facturation_service/; }
        location /api/statistiques/  { proxy_pass http://statistiques_service/; }
        location /api/diagnosis/     { proxy_pass http://ai_diagnosis/; }
        location /api/notification/ { proxy_pass http://notification_service/; }
        location /api/audit/        { proxy_pass http://audit_service/; }
        location /api/file/         { proxy_pass http://file_service/; }
        location /api/clinique/      { proxy_pass http://clinique_service/; }

        # Découverte de secours (HTTP Fallback)
        location /discovery {
            proxy_pass http://realtime_gateway/discovery;
        }

        location /api/discovery {
            proxy_pass http://realtime_gateway/discovery;
        }

        # Gateway WebSocket (notifications temps réel)
        location /ws/ {
            proxy_pass http://realtime_gateway/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /health {
            return 200 '{"status":"OK","service":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}
